# Backend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trading-backend
  template:
    metadata:
      labels:
        app: trading-backend
    spec:
      containers:
        - name: backend
          image: trading-backend:latest
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
---
apiVersion: v1
kind: Service
metadata:
  name: trading-backend
spec:
  selector:
    app: trading-backend
  ports:
    - port: 4000
      targetPort: 4000
---
# Frontend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trading-frontend
  template:
    metadata:
      labels:
        app: trading-frontend
    spec:
      containers:
        - name: frontend
          image: trading-frontend:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: trading-frontend
spec:
  selector:
    app: trading-frontend
  ports:
    - port: 80
      targetPort: 80
---
# Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trading-ingress
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: trading-backend
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trading-frontend
                port:
                  number: 80
